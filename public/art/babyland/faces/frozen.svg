<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
<!-- BABYLAND — выражение «frozen».
     Накладка на ПУСТОЕ лицо базы. Пять выражений нельзя генерировать: пять
     генераций дадут пять разных девочек. Нарисованная накладка садится по
     одному якорю (generation.face_anchor) и совпадает всегда.
     улыбка шире физиологичной, зрачки в точку — «идеальная девочка» после успешного прохождения -->
<style>
  .ln { fill: none; stroke: #43303a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .eye { fill: #ffffff; stroke: #43303a; stroke-width: 5; }
  .pup { fill: #43303a; }
  .hi  { fill: #ffffff; }
  .lip { fill: #e0567f; stroke: #43303a; stroke-width: 4.5; stroke-linejoin: round; }
</style>
<path class="ln" d="M44,20 Q62,10 80,18"/>
  <path class="ln" d="M120,18 Q138,10 156,20"/>
  <ellipse class="eye" cx="62" cy="48" rx="22" ry="26"/>
  <ellipse class="eye" cx="138" cy="48" rx="22" ry="26"/>
  <circle class="pup" cx="62" cy="48" r="6"/>
  <circle class="pup" cx="138" cy="48" r="6"/>
  <path class="ln" d="M44,40 l-12.0,-8.0"/>
  <path class="ln" d="M44,47 l-14.0,-4.0"/>
  <path class="ln" d="M44,54 l-14.0,0.5"/>
  <path class="ln" d="M156,40 l12.0,-8.0"/>
  <path class="ln" d="M156,47 l14.0,-4.0"/>
  <path class="ln" d="M156,54 l14.0,0.5"/>
  <path class="lip" d="M66,88 Q100,116 134,88 Q100,100 66,88 Z"/>
  <path class="ln" d="M72,90 L128,90"/>
</svg>
