<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 0 400 1200" width="400" height="1200">
<!-- BABYLAND — база куклы.
     Написана руками, а не сгенерирована: к ней привязаны координаты всех 55
     вещей, лицо обязано быть пустым ПО ПОСТРОЕНИЮ (мимика кладётся своим
     слоем), и именно она задаёт язык рисования, в который должны попадать
     сгенерированные вещи.

     Приём: все формы объявлены один раз в <g id="body">, затем рисуются
     дважды — сначала толстой обводкой, потом заливкой поверх. Так получается
     единый внешний контур без внутренних швов на стыках рук и торса.

     Пропорции: голова крупная (как у флеш-куклы), торс с перехватом в талии,
     руки отведены от корпуса — иначе силуэт слипается в столб. -->
<defs>
  <g id="body">
    <!-- голова: к подбородку сужается, иначе читается яйцом -->
    <path d="M300,58 C356,58 380,104 380,152 C380,202 346,242 300,242
             C254,242 220,202 220,152 C220,104 244,58 300,58 Z"/>
    <!-- шея -->
    <path d="M300,244 L300,296" stroke-width="54"/>
    <!-- торс: плечи → перехват талии → бёдра -->
    <path d="M222,304 Q300,278 378,304
             L348,434 Q390,506 388,566
             Q300,596 212,566 Q210,506 252,434 Z"/>
    <!-- руки отведены наружу: между рукой и корпусом должен быть просвет -->
    <path d="M242,320 Q190,410 196,524" stroke-width="54"/>
    <path d="M358,320 Q410,410 404,524" stroke-width="54"/>
    <!-- кисти -->
    <circle cx="196" cy="548" r="31"/>
    <circle cx="404" cy="548" r="31"/>
    <!-- ноги слегка расходятся книзу — иначе сливаются в колонну -->
    <path d="M268,574 Q246,786 252,1020" stroke-width="72"/>
    <path d="M332,574 Q354,786 348,1020" stroke-width="72"/>
    <!-- ступни -->
    <ellipse cx="246" cy="1050" rx="50" ry="30"/>
    <ellipse cx="354" cy="1050" rx="50" ry="30"/>
  </g>

  <g id="underwear">
    <!-- бретели: короткие, чтобы не торчали над плечами -->
    <path d="M268,348 L284,308" stroke-width="9"/>
    <path d="M332,348 L316,308" stroke-width="9"/>
    <!-- лиф -->
    <path d="M250,346 Q300,332 350,346 L348,388 Q300,408 252,388 Z"/>
    <!-- трусы -->
    <path d="M254,488 L346,488 L340,536 Q300,572 260,536 Z"/>
  </g>
</defs>

<style>
  .ol { fill: #43303a; stroke: #43303a; stroke-width: 24;
        stroke-linejoin: round; stroke-linecap: round; }
  .sk { fill: #f7d6bd; stroke: #f7d6bd; stroke-width: 6;
        stroke-linejoin: round; stroke-linecap: round; }
  .uw-ol { fill: #43303a; stroke: #43303a; stroke-width: 20;
           stroke-linejoin: round; stroke-linecap: round; }
  .uw    { fill: #ffc3dd; stroke: #ffc3dd; stroke-width: 5;
           stroke-linejoin: round; stroke-linecap: round; }
</style>

<!-- сначала весь контур, затем вся заливка — внутренних швов не остаётся -->
<use href="#body" class="ol"/>
<use href="#body" class="sk"/>
<use href="#underwear" class="uw-ol"/>
<use href="#underwear" class="uw"/>

<!-- Лицо НЕ рисуется. Глаза, брови и рот приходят накладкой выражения:
     так регистрация мимики наша, а не модели, и совпадает всегда. -->
</svg>
