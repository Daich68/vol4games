<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>призма — vol4games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #0a0a14 0%, #050509 45%, #030308 100%);
    color: #fff;
  }

  /* портретная рамка-«терминал» по центру экрана */
  .frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 100vh;
    height: 100dvh;                 /* учитываем плавающий URL-бар Safari */
    width: min(58vh, 100vw);
    display: flex; flex-direction: column;
    padding: 56px 18px 52px;
  }

  /* ── HUD: счётчики уехали на рейку безеля, тут остался ветер/осколки ────── */
  #hud { flex: 0 0 auto; }

  #windbar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .wb-grp { display: inline-flex; align-items: baseline; gap: 8px; min-width: 0; }
  .w-cap {
    font-size: var(--t-xs);
    letter-spacing: var(--tk-wide);
    text-transform: uppercase;
    color: var(--c-label);
  }
  #windMeter {
    font-size: var(--t-sm);
    letter-spacing: 0.18em;
    color: var(--c-value);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-shadow: 0 0 10px rgba(232,236,245,0.18);
  }
  #orbMeter {
    font-size: var(--t-sm);
    letter-spacing: 0.16em;
    color: var(--c-accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-shadow: var(--c-glow);
  }

  /* ── сцена: канвас в кристаллической рамке ──────────────────────────────── */
  #stage {
    flex: 1 1 auto; min-height: 0;
    position: relative;
    margin-top: 16px;
    border: 1px solid var(--c-rule);
  }
  #c {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    image-rendering: auto;   /* гладкая отрисовка призмы (было pixelated) */
  }

  /* халфтон-текстура поверх канваса — экран множит свет в точечную сетку */
  #dots {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
    background-image: radial-gradient(circle at center, #15151f 0.6px, transparent 1px);
    background-size: 3.5px 3.5px;
    mix-blend-mode: multiply;
    opacity: 0.55;
  }

  /* строфа стиха — снизу сцены */
  #stanza {
    position: absolute; z-index: 2;
    left: 50%; bottom: 16px;
    transform: translateX(-50%) translateY(6px);
    width: 90%;
    text-align: center;
    color: var(--c-value);
    font-size: clamp(10px, 1.4vh, 13px);
    line-height: 1.65em;
    letter-spacing: 0.04em;
    opacity: 0;
    transition: opacity 0.7s ease-out, transform 0.7s;
    text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 14px rgba(0,0,0,0.8);
    pointer-events: none;
    white-space: pre-wrap;
  }
  #stanza.show { opacity: 0.9; transform: translateX(-50%) translateY(0); }

  /* ── оверлеи (терминальные карточки) ────────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(4, 4, 9, 0.84);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .ov-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
    padding: 40px 44px;
    max-width: min(92vw, 460px);
    border: 1px solid var(--c-rule);
    background: rgba(6, 6, 12, 0.55);
  }
  /* четыре угла рамки-терминала */
  .ov-card::before, .ov-card::after,
  .ov-card > .cn { pointer-events: none; }
  .cn {
    position: absolute; font-size: 15px; line-height: 1;
    color: var(--c-accent-dim);
    text-shadow: 0 0 10px rgba(232,236,245,0.3);
  }
  .cn.tl { top: -8px; left: -7px; }
  .cn.tr { top: -8px; right: -7px; }
  .cn.bl { bottom: -8px; left: -7px; }
  .cn.br { bottom: -8px; right: -7px; }

  .ov-meta {
    color: var(--c-accent-dim);
    font-size: var(--t-xs); letter-spacing: var(--tk-mega);
    text-transform: uppercase;
  }
  .ov-meta.danger { color: var(--c-danger); }
  .ov-card .t-display { text-align: center; }
  .ov-sub {
    color: var(--c-label); font-size: var(--t-md);
    letter-spacing: var(--tk-norm); text-align: center;
    line-height: 1.7em; max-width: 26em;
  }
  .ov-who {
    font-size: var(--t-xs); letter-spacing: var(--tk-wide);
    text-transform: uppercase; color: var(--c-muted);
  }
  .ov-who #winName { color: var(--c-accent); }
  .ov-poem {
    color: var(--c-value);
    font-size: clamp(10px, 1.3vh, 12px);
    line-height: 1.75em; letter-spacing: 0.04em;
    max-height: 42vh; overflow-y: auto;
    text-align: center; max-width: 36em;
    white-space: pre-wrap;
    padding: 4px 6px;
    border-top: 1px solid var(--c-rule);
    border-bottom: 1px solid var(--c-rule);
  }
  .ov-back {
    margin-top: 2px;
    text-decoration: none; color: var(--c-muted);
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    transition: color 0.2s;
  }
  .ov-back:hover { color: var(--c-accent); }
</style>
</head>
<body>
<div class="frame">
  <header id="hud">
    <div id="windbar">
      <span class="wb-grp"><span class="w-cap">ветер</span><span id="windMeter">▮▯▯▯ тихо</span></span>
      <span class="wb-grp"><span class="w-cap">осколки</span><span id="orbMeter">✦ 0</span></span>
    </div>
  </header>

  <section id="stage">
    <canvas id="c"></canvas>
    <div id="dots"></div>
    <div id="stanza"></div>
  </section>
</div>

<!-- ── приборная панель: безель + рейки с приборами ─────────────────────── -->
<div class="os-bezel"><i>┌</i><i>┐</i><i>└</i><i>┘</i></div>
<header class="os-rail top">
  <div id="title" class="t-path">vol4:<span class="dim">//</span>призма</div>
  <div class="os-cells">
    <div class="t-stat">
      <div class="t-label">этаж</div>
      <div class="t-value" id="floor">0</div>
    </div>
    <div class="t-stat center">
      <div class="t-label">очки</div>
      <div class="t-value accent" id="score">0</div>
    </div>
    <div class="t-stat end">
      <div class="t-label">комбо</div>
      <div class="t-value" id="combo">—</div>
    </div>
  </div>
  <a id="back" href="/">← карта</a>
</header>
<div class="os-rail bot">
  <div id="hint" class="t-hint arrow">← → разбег · SPACE прыжок · ESC карта</div>
</div>

<div id="winOverlay" class="overlay">
  <div class="ov-card">
    <span class="cn tl">┌</span><span class="cn tr">┐</span>
    <span class="cn bl">└</span><span class="cn br">┘</span>
    <div class="ov-meta">▲ вершина</div>
    <div class="t-display" style="color: var(--c-accent);">пагода сокровищ</div>
    <div class="ov-sub">обратный отсчёт окончен</div>
    <div class="ov-who">взошёл&nbsp;·&nbsp;<span id="winName">—</span></div>
    <div class="ov-poem" id="winPoem"></div>
    <a class="t-btn" href="/" style="text-decoration:none">← на карту</a>
  </div>
</div>

<div id="loseOverlay" class="overlay">
  <div class="ov-card">
    <span class="cn tl">┌</span><span class="cn tr">┐</span>
    <span class="cn bl">└</span><span class="cn br">┘</span>
    <div class="ov-meta danger">▼ падение</div>
    <div class="t-display">ветер сильнее</div>
    <div class="ov-sub" id="loseSub">не доросло</div>
    <button class="t-btn" data-action="restart">с начала</button>
    <a class="ov-back" href="/">← карта</a>
  </div>
</div>

<!-- мобильное управление: джойстик (разбег) + кнопка прыжка -->
<div id="touch-ctrl">
  <div id="joystick"><div id="joyKnob"></div></div>
  <button id="tc-jump">↑</button>
</div>
<style>
  #touch-ctrl {
    display: none;          /* JS включает если touch-устройство */
    position: fixed;
    left: 0; right: 0;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    z-index: 50;
    padding-left:  calc(24px + env(safe-area-inset-left, 0px));
    padding-right: calc(24px + env(safe-area-inset-right, 0px));
    align-items: center; justify-content: space-between;
    pointer-events: none;   /* ловят только дочерние контролы */
  }
  #touch-ctrl.visible { display: flex; }
  #joystick, #tc-jump { pointer-events: auto; }

  /* на мобайле прячем клавиатурные подписи (выход остаётся на верхней рейке) */
  body.is-touch #hint  { display: none; }
  body.is-touch #title { display: none; }
  /* место под рейку сверху и джойстик снизу */
  body.is-touch .frame {
    padding-top: calc(54px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(176px + env(safe-area-inset-bottom, 0px));
  }

  /* ── джойстик разбега ── */
  #joystick {
    position: relative;
    width: 132px; height: 132px;
    border-radius: 50%;
    border: 1px solid rgba(232,236,245,0.18);
    background: radial-gradient(circle at 50% 50%, rgba(232,236,245,0.05), rgba(232,236,245,0.015));
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #joystick::before {       /* горизонтальная риска-направляющая */
    content: ""; position: absolute; top: 50%; left: 16%; right: 16%;
    height: 1px; background: rgba(232,236,245,0.12); transform: translateY(-0.5px);
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%;
    width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 50%;
    border: 1px solid rgba(232,236,245,0.4);
    background: rgba(232,236,245,0.14);
    box-shadow: 0 0 18px rgba(232,236,245,0.12);
    transition: transform 0.1s ease-out, background 0.1s;
    will-change: transform;
  }
  #joystick.active #joyKnob {
    background: rgba(232,236,245,0.26);
    border-color: rgba(232,236,245,0.6);
    transition: background 0.1s;   /* при перетаскивании ручка идёт мгновенно */
  }

  /* ── кнопка прыжка ── */
  #tc-jump {
    width: 104px; height: 104px;
    border-radius: 50%;
    background: rgba(232,236,245,0.07);
    border: 1px solid rgba(232,236,245,0.22);
    color: rgba(232,236,245,0.65);
    font-family: var(--font-mono, monospace);
    font-size: 30px; line-height: 1;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.06s, color 0.06s, border-color 0.06s;
  }
  #tc-jump.pressed {
    background: rgba(232,236,245,0.2);
    color: #e8ecf5; border-color: rgba(232,236,245,0.5);
    box-shadow: 0 0 16px rgba(232,236,245,0.18);
  }
</style>
<script>
  // показываем кнопки только на touch-устройствах
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
    document.body.classList.add("is-touch");
    document.getElementById("touch-ctrl").classList.add("visible");
  }
</script>
<div class="scanlines"></div>

<!-- CRT-кинескоп: страница включается из чёрного (логика в shared/os.js) -->
<div id="crtFx" class="boot"><div class="crt-top"></div><div class="crt-bot"></div><div class="crt-line"></div></div>
<style>
  /* закрытое состояние до загрузки os.css — без вспышки контента */
  #crtFx { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
  #crtFx .crt-top, #crtFx .crt-bot { position: absolute; left: 0; right: 0; height: 50.5%; background: #000; }
  #crtFx .crt-top { top: 0; transform-origin: 50% 0; }
  #crtFx .crt-bot { bottom: 0; transform-origin: 50% 100%; }
  #crtFx .crt-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; background: #e8ecf5; opacity: 0; }
</style>
<script type="module" src="/src/games/prizma/main.js"></script>
</body>
</html>
