<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>сталагмит — vol4games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #0a0a14 0%, #050509 45%, #030308 100%);
    color: #fff;
    touch-action: none;            /* мгновенный тап без задержки double-tap */
  }

  /* портретная рамка-«терминал» по центру экрана (как в остальных играх) */
  .frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 100vh;
    height: 100dvh;                 /* учитываем плавающий URL-бар Safari */
    width: min(58vh, 100vw);
  }
  #c {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    background: #000;
  }
  /* кристаллическая рамка сцены */
  #frameBorder {
    position: absolute; inset: 0;
    border: 1px solid var(--c-rule);
    pointer-events: none; z-index: 2;
  }
  .corner {
    position: absolute; z-index: 3;
    font-size: 13px; line-height: 1;
    color: var(--c-accent-dim);
    pointer-events: none;
    text-shadow: 0 0 8px rgba(232,236,245,0.25);
  }
  .corner.tl { top: -7px;    left: -6px;  }
  .corner.tr { top: -7px;    right: -6px; }
  .corner.bl { bottom: -7px; left: -6px;  }
  .corner.br { bottom: -7px; right: -6px; }

  /* ── угловые подписи экрана ─────────────────────────────────────────────── */
  #title   { position: fixed; top: 20px; left: 22px; z-index: 40; }
  #counter {
    position: fixed; top: 20px; right: 22px; z-index: 40;
    font-size: var(--t-sm);
    letter-spacing: 0.2em;
    color: var(--c-accent);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(232,236,245,0.18);
  }
  #hint  { position: fixed; bottom: 20px; left: 22px; z-index: 40; }
  #back  {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 22px; z-index: 40;
    text-decoration: none; color: var(--c-muted);
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    pointer-events: auto;
    transition: color 0.2s, text-shadow 0.2s;
  }
  #back:hover { color: var(--c-accent); text-shadow: var(--c-glow); }

  /* ── мобайл: учитываем нотч/безопасные зоны; прячем декоративный заголовок ─ */
  @media (pointer: coarse) {
    #title { display: none; }
    #counter {
      top: calc(20px + env(safe-area-inset-top, 0px));
      right: calc(22px + env(safe-area-inset-right, 0px));
    }
    #hint { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  }

  /* ── статус: терминальная карточка (победа/поражение) ───────────────────── */
  #status {
    position: fixed; left: 50%; top: 42%;
    transform: translate(-50%, -50%);
    z-index: 50;
    max-width: min(86vw, 420px);
    padding: 30px 34px;
    border: 1px solid var(--c-rule);
    background: rgba(6, 6, 12, 0.72);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-size: var(--t-lg); font-weight: 300;
    letter-spacing: var(--tk-wide);
    color: var(--c-value); text-transform: uppercase;
    text-align: center; line-height: 1.25;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s;
  }
  #status::before, #status::after {
    position: absolute; font-size: 15px; line-height: 1;
    color: var(--c-accent-dim);
    text-shadow: 0 0 10px rgba(232,236,245,0.3);
  }
  #status::before { content: "┌"; top: -8px;    left: -7px;  }
  #status::after  { content: "┘"; bottom: -8px; right: -7px; }
  #status .sub {
    display: block; margin-top: 16px;
    font-size: var(--t-xs); color: var(--c-muted);
    letter-spacing: var(--tk-wide); line-height: 1.7em;
    text-transform: uppercase;
  }
  #status.show { opacity: 1; }

  /* ── финальный стих — встроен в композицию ──────────────────────────────
     башня гаснет до призрачной фактуры, стих занимает весь кадр колонкой
     по центру (без коробки и без скролла; JS ужимает кегль под высоту). */
  #poem {
    position: fixed; inset: 0;
    z-index: 45;
    display: flex; align-items: center; justify-content: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 54px)
      24px
      calc(env(safe-area-inset-bottom, 0px) + 48px);
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease-out;
  }
  #poem.show { opacity: 1; }
  .poem-body {
    width: 100%; max-width: 32em;
    color: var(--c-value);
    font-size: 13px; line-height: 1.85em;   /* стартовый кегль; JS ужмёт под кадр */
    letter-spacing: 0.04em;
    white-space: pre-wrap; text-align: center;
    text-shadow: 0 0 14px rgba(3,3,8,0.96), 0 1px 5px rgba(3,3,8,0.92);
  }
  .poem-body .sig {
    display: block; margin-top: 1.7em;
    opacity: 0.6; font-size: 0.82em; color: var(--c-muted);
    letter-spacing: var(--tk-wide);
  }

  /* в финале башня уходит на задний план, служебные подписи гаснут */
  #c { transition: opacity 1.4s ease-out; }
  #counter { transition: opacity 1s ease-out; }
  body.finale #c { opacity: 0.16; }
  body.finale #counter, body.finale #hint { opacity: 0; }

  /* в финале статус — не карточка, а тихая строка у нижнего края */
  body.finale #status {
    top: auto;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: 50%; transform: translate(-50%, 0);
    max-width: none; padding: 0;
    border: none; background: none;
    backdrop-filter: none; -webkit-backdrop-filter: none;
    font-size: var(--t-xs); font-weight: 400; color: var(--c-muted);
  }
  body.finale #status::before, body.finale #status::after { content: none; }
  body.finale #status .sub { margin-top: 0; }
</style>
</head>
<body>
<div class="frame">
  <canvas id="c"></canvas>
  <div id="frameBorder"></div>
  <span class="corner tl">┌</span>
  <span class="corner tr">┐</span>
  <span class="corner bl">└</span>
  <span class="corner br">┘</span>
</div>

<div id="title" class="t-mark">vol4 · СТАЛАГМИТ</div>
<div id="counter">000 / 010</div>
<div id="hint" class="t-hint arrow">SPACE сбросить · ESC карта</div>
<a   id="back" href="/">← карта</a>

<div id="status"></div>
<div id="poem"></div>

<div class="scanlines"></div>

<script>
  // на тач-устройствах механика «сбросить блок» = тап по экрану (обрабатывается в main.js через click)
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
    var _h = document.getElementById("hint");
    if (_h) _h.textContent = "тап · сбросить блок";
  }
</script>
<script type="module" src="/src/games/stalagmit/main.js"></script>
</body>
</html>
