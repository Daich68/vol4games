<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>нэнси дрю — vol4games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #0a0a14 0%, #050509 45%, #030308 100%);
    color: #fff;
  }

  .frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 100vh;
    height: 100dvh;                 /* учитываем плавающий URL-бар Safari */
    width: min(58vh, 100vw);
    display: flex; flex-direction: column;
    padding: 46px 18px 40px;
  }

  /* ── HUD ──────────────────────────────────────────────────────────────── */
  #hud { flex: 0 0 auto; }
  #topbar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: end;
    gap: 8px;
    padding-bottom: 11px;
    border-bottom: 1px solid var(--c-rule);
  }

  /* ── сцена ─────────────────────────────────────────────────────────────── */
  #stage {
    flex: 1 1 auto; min-height: 0;
    position: relative;
    margin-top: 14px;
    border: 1px solid var(--c-rule);
    background: #1a1206;
    overflow: hidden;
  }
  #c {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: manipulation;
  }
  .corner {
    position: absolute; z-index: 4;
    font-size: 13px; line-height: 1;
    color: var(--c-accent-dim);
    pointer-events: none;
    text-shadow: 0 0 8px rgba(232,236,245,0.25);
  }
  .corner.tl { top: -7px;    left: -6px;  }
  .corner.tr { top: -7px;    right: -6px; }
  .corner.bl { bottom: -7px; left: -6px;  }
  .corner.br { bottom: -7px; right: -6px; }

  /* ── улика (загадка) — нижняя полоса поверх сцены, как в референсе ───────── */
  #riddle {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 26px 16px 11px;
    background: linear-gradient(to top, rgba(6,6,11,0.94) 38%, rgba(6,6,11,0.7) 70%, rgba(6,6,11,0));
    color: var(--c-value);
    font-size: clamp(10.5px, 1.42vh, 12.5px);
    line-height: 1.62em;
    letter-spacing: 0.02em;
    white-space: pre-wrap;
    text-align: center;
    font-style: italic;
    transition: color 0.25s;
    pointer-events: none;
  }
  #riddle.flash-wrong { color: var(--c-danger); }
  #riddle.flash-right { color: var(--c-accent); text-shadow: 0 0 14px rgba(232,236,245,0.4); }

  /* кнопка-подсказка «?» — верхний правый угол сцены */
  #hintBtn {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,6,11,0.6);
    border: 1px solid var(--c-rule);
    color: var(--c-accent-dim);
    font-family: var(--font-mono);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: color 0.18s, border-color 0.18s, box-shadow 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  #hintBtn:hover { color: var(--c-accent); border-color: var(--c-accent-dim); box-shadow: var(--c-glow); }
  #hintBtn:disabled { opacity: 0.28; cursor: default; box-shadow: none; }
  #hintBtn .cd {
    position: absolute; bottom: -1px; right: 1px;
    font-size: 8px; letter-spacing: 0; color: var(--c-accent-dim);
  }

  /* счётчик улики в левом верхнем углу сцены */
  #caseNo {
    position: absolute; top: 9px; left: 10px; z-index: 5;
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    color: var(--c-accent-dim);
    pointer-events: none;
  }

  /* ── блокнот: кнопка снизу + всплывающая страница со всем текстом ───────── */
  #notebookBtn {
    flex: 0 0 auto;
    position: relative;
    margin-top: 12px;
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--c-rule);
    color: var(--c-value);
    font-family: var(--font-mono);
    font-size: var(--t-sm); font-weight: 500;
    letter-spacing: var(--tk-wide); text-transform: uppercase;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s, box-shadow .2s;
  }
  #notebookBtn:hover { border-color: var(--c-accent-dim); color: var(--c-accent); background: var(--c-accent-bg); box-shadow: var(--c-glow); }
  #notebookBtn .nbb-l { display: flex; align-items: center; gap: 9px; }
  #notebookBtn .nbb-l::before { content: "▤"; opacity: 0.6; }
  #notebookBtn .nbb-r { color: var(--c-accent-dim); letter-spacing: var(--tk-norm); font-variant-numeric: tabular-nums; }
  /* «есть новая запись» — мигает и зовёт открыть */
  #notebookBtn.has-new { border-color: var(--c-accent); color: var(--c-accent); animation: nb-pulse 1.15s ease-in-out infinite; }
  #notebookBtn.has-new .nbb-r { color: var(--c-accent); }
  @keyframes nb-pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(232,236,245,0); }
    50%      { box-shadow: 0 0 16px rgba(232,236,245,0.42); }
  }

  #nbNudge {
    position: absolute; left: 0; right: 0; bottom: 96px;
    text-align: center; pointer-events: none; z-index: 45;
    opacity: 0; transform: translateY(6px);
    transition: opacity .35s, transform .35s;
  }
  #nbNudge.show { opacity: 1; transform: none; }
  #nbNudge span {
    display: inline-block;
    background: rgba(6,6,11,0.94);
    border: 1px solid var(--c-accent);
    color: var(--c-accent);
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    padding: 7px 13px;
  }
  #nbNudge span::after { content: " ↓"; }

  /* всплывающая страница блокнота — длинная проза, читаем слева */
  #nbText { text-align: left; }
  .nb-stanza { margin-bottom: 0.95em; white-space: pre-wrap; opacity: 0; transform: translateY(3px); animation: nb-write .8s ease forwards; }
  .nb-stanza:last-child { margin-bottom: 0; }
  .nb-empty { color: rgba(255,255,255,0.3); font-style: italic; }
  @keyframes nb-write { to { opacity: 1; transform: none; } }

  /* финальная запись — БЛОКНОТ — выделена особо */
  .nb-final {
    color: var(--c-accent);
    padding: 16px 18px;
    border: 1px solid rgba(232,236,245,0.35);
    background: rgba(232,236,245,0.055);
    animation: nb-write .8s ease forwards, nb-glow 2.2s ease-in-out 0.8s infinite alternate;
    box-shadow: 0 0 0 rgba(232,236,245,0);
  }
  @keyframes nb-glow {
    from { box-shadow: 0 0 6px rgba(232,236,245,0.10); border-color: rgba(232,236,245,0.25); }
    to   { box-shadow: 0 0 22px rgba(232,236,245,0.38); border-color: rgba(232,236,245,0.65); }
  }

  /* ── chrome ────────────────────────────────────────────────────────────── */
  #title { position: fixed; top: 20px; left: 22px; z-index: 40; }
  #hint  { position: fixed; bottom: 20px; left: 22px; z-index: 40; }
  #back  {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 22px; z-index: 40;
    text-decoration: none; color: var(--c-muted);
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    transition: color 0.2s, text-shadow 0.2s;
  }
  #back:hover { color: var(--c-accent); text-shadow: var(--c-glow); }

  @media (pointer: coarse) {
    #title, #hint { display: none; }
    .frame {
      padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    }
    #back { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  }

  /* ── оверлей (терминальная карточка) ───────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(4, 4, 9, 0.88);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s;
    padding: 28px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .ov-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    gap: 15px;
    padding: 38px 40px;
    max-width: min(92vw, 460px);
    border: 1px solid var(--c-rule);
    background: rgba(6, 6, 12, 0.55);
  }
  .cn {
    position: absolute; font-size: 15px; line-height: 1;
    color: var(--c-accent-dim);
    text-shadow: 0 0 10px rgba(232,236,245,0.3);
    pointer-events: none;
  }
  .cn.tl { top: -8px; left: -7px; }
  .cn.tr { top: -8px; right: -7px; }
  .cn.bl { bottom: -8px; left: -7px; }
  .cn.br { bottom: -8px; right: -7px; }
  .ov-meta {
    color: var(--c-accent-dim);
    font-size: var(--t-xs); letter-spacing: var(--tk-mega);
    text-transform: uppercase;
  }
  .ov-card .t-display { text-align: center; }
  .ov-stats {
    font-size: var(--t-xs); letter-spacing: var(--tk-wide);
    text-transform: uppercase; color: var(--c-accent);
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .ov-poem {
    color: var(--c-value);
    font-size: clamp(10px, 1.3vh, 12px);
    line-height: 1.8em; letter-spacing: 0.04em;
    max-height: 44vh; overflow-y: auto;
    text-align: center; max-width: 38em;
    white-space: pre-wrap;
    padding: 6px 10px;
    border-top: 1px solid var(--c-rule);
    border-bottom: 1px solid var(--c-rule);
  }
  .ov-back {
    margin-top: 2px;
    text-decoration: none; color: var(--c-muted);
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    transition: color 0.2s;
  }
  .ov-back:hover { color: var(--c-accent); }
</style>
</head>
<body>
<div class="frame">
  <header id="hud">
    <div id="topbar">
      <div class="t-stat">
        <div class="t-label">улика</div>
        <div class="t-value" id="riddle-num">1 / 6</div>
      </div>
      <div class="t-stat center">
        <div class="t-label">дело</div>
        <div class="t-value accent" style="font-size: var(--t-md); letter-spacing: var(--tk-wide);">нэнси дрю</div>
      </div>
      <div class="t-stat end">
        <div class="t-label">найдено</div>
        <div class="t-value" id="found-count">0 / 6</div>
      </div>
    </div>
  </header>

  <section id="stage">
    <canvas id="c"></canvas>
    <div id="caseNo">досье № 1</div>
    <button id="hintBtn" title="подсказка — показать предмет">?</button>
    <div id="riddle"></div>
    <span class="corner tl">┌</span>
    <span class="corner tr">┐</span>
    <span class="corner bl">└</span>
    <span class="corner br">┘</span>
  </section>

  <button id="notebookBtn" type="button" title="открыть блокнот">
    <span class="nbb-l">блокнот</span>
    <span class="nbb-r" id="nbCount">пусто</span>
  </button>
  <div id="nbNudge"><span>новая запись — открой блокнот</span></div>
</div>

<div id="title" class="t-mark">vol4 · НЭНСИ ДРЮ</div>
<div id="hint"  class="t-hint arrow">найди предмет улики · «?» — подсказка</div>
<a   id="back"  href="/">← карта</a>

<div id="winOverlay" class="overlay">
  <div class="ov-card">
    <span class="cn tl">┌</span><span class="cn tr">┐</span>
    <span class="cn bl">└</span><span class="cn br">┘</span>
    <div class="ov-meta">дело закрыто</div>
    <div class="t-display" style="color: var(--c-accent);">все смерти найдены</div>
    <div class="ov-stats" id="winStats"></div>
    <div class="ov-poem" id="winPoem"></div>
    <a class="t-btn" href="/" style="text-decoration:none">← на карту</a>
  </div>
</div>

<div id="nbOverlay" class="overlay">
  <div class="ov-card">
    <span class="cn tl">┌</span><span class="cn tr">┐</span>
    <span class="cn bl">└</span><span class="cn br">┘</span>
    <div class="ov-meta">блокнот детектива</div>
    <div class="ov-poem" id="nbText"></div>
    <button class="t-btn" id="nbClose" type="button">закрыть</button>
  </div>
</div>

<div class="scanlines"></div>
<script type="module" src="/src/games/nancy-drew/main.js"></script>
</body>
</html>
