<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>нэнси дрю — vol4games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #0a0a14 0%, #050509 45%, #030308 100%);
    color: #fff;
  }

  .frame {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 100vh;
    height: 100dvh;                 /* учитываем плавающий URL-бар Safari */
    width: min(58vh, 100vw);
    display: flex; flex-direction: column;
    padding: 56px 18px 52px;
  }

  /* ── сцена (HUD уехал на рейку безеля) ──────────────────────────────────── */
  #stage {
    flex: 1 1 auto; min-height: 0;
    position: relative;
    border: 1px solid var(--c-rule);
    background: #1a1206;
    overflow: hidden;
  }
  #c {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    cursor: crosshair;
    touch-action: manipulation;
  }

  /* ── улика (загадка) — нижняя полоса поверх сцены, как в референсе ───────── */
  #riddle {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 26px 16px 11px;
    background: linear-gradient(to top, rgba(6,6,11,0.94) 38%, rgba(6,6,11,0.7) 70%, rgba(6,6,11,0));
    color: var(--c-value);
    font-size: clamp(10.5px, 1.42vh, 12.5px);
    line-height: 1.62em;
    letter-spacing: 0.02em;
    white-space: pre-wrap;
    text-align: center;
    font-style: italic;
    transition: color 0.25s;
    pointer-events: none;
  }
  #riddle.flash-wrong { color: var(--c-danger); }
  #riddle.flash-right { color: var(--c-accent); text-shadow: 0 0 14px rgba(232,236,245,0.4); }

  /* кнопка-подсказка «?» — верхний правый угол сцены */
  #hintBtn {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,6,11,0.6);
    border: 1px solid var(--c-rule);
    color: var(--c-accent-dim);
    font-family: var(--font-mono);
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    transition: color 0.18s, border-color 0.18s, box-shadow 0.18s;
    -webkit-tap-highlight-color: transparent;
  }
  #hintBtn:hover { color: var(--c-accent); border-color: var(--c-accent-dim); box-shadow: var(--c-glow); }
  #hintBtn:disabled { opacity: 0.28; cursor: default; box-shadow: none; }
  #hintBtn .cd {
    position: absolute; bottom: -1px; right: 1px;
    font-size: 8px; letter-spacing: 0; color: var(--c-accent-dim);
  }

  /* счётчик улики в левом верхнем углу сцены */
  #caseNo {
    position: absolute; top: 9px; left: 10px; z-index: 5;
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    color: var(--c-accent-dim);
    pointer-events: none;
  }

  /* ── блокнот-кнопка: кожаная обложка с резинкой (мир сцены, не терминал) ── */
  #notebookBtn {
    flex: 0 0 auto;
    position: relative;
    margin-top: 12px;
    width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 44px 13px 16px;
    background:
      radial-gradient(150% 220% at 10% -20%, rgba(150,95,40,0.35), transparent 55%),
      linear-gradient(160deg, #4a2c12, #2c1808 55%, #1c0f05);
    border: 1px solid #120b04;
    color: #d8c49a;
    font-family: var(--font-mono);
    font-size: var(--t-sm); font-weight: 500;
    letter-spacing: var(--tk-wide); text-transform: uppercase;
    cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,200,120,0.14), inset 0 0 26px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.4);
    transition: box-shadow .2s, color .2s;
  }
  /* прошитый край обложки */
  #notebookBtn::after {
    content: ""; position: absolute; inset: 4px;
    border: 1px dashed rgba(216,196,154,0.28);
    pointer-events: none;
  }
  /* красная резинка-закладка */
  #notebookBtn::before {
    content: ""; position: absolute; top: -3px; bottom: -3px; right: 24px;
    width: 9px;
    background: linear-gradient(to right, #6e1a12, #a83226 45%, #5e150e);
    box-shadow: 1px 0 5px rgba(0,0,0,0.55);
  }
  #notebookBtn:hover { color: #f4e2b8; box-shadow: inset 0 1px 0 rgba(255,200,120,0.2), inset 0 0 26px rgba(0,0,0,0.5), 0 0 18px rgba(255,190,90,0.16); }
  #notebookBtn .nbb-l { display: flex; align-items: center; gap: 9px; }
  #notebookBtn .nbb-l::before { content: "▤"; opacity: 0.6; }
  #notebookBtn .nbb-r { color: #b89a64; letter-spacing: var(--tk-norm); font-variant-numeric: tabular-nums; }
  /* «есть новая запись» — тёплый пульс обложки */
  #notebookBtn.has-new { color: #ffd9a0; animation: nb-pulse 1.15s ease-in-out infinite; }
  #notebookBtn.has-new .nbb-r { color: #ffd9a0; }
  @keyframes nb-pulse {
    0%, 100% { box-shadow: inset 0 0 26px rgba(0,0,0,0.55), 0 0 0 rgba(255,196,110,0); }
    50%      { box-shadow: inset 0 0 26px rgba(0,0,0,0.4), 0 0 20px rgba(255,196,110,0.45); }
  }

  #nbNudge {
    position: absolute; left: 0; right: 0; bottom: 96px;
    text-align: center; pointer-events: none; z-index: 45;
    opacity: 0; transform: translateY(6px);
    transition: opacity .35s, transform .35s;
  }
  #nbNudge.show { opacity: 1; transform: none; }
  #nbNudge span {
    display: inline-block;
    background: rgba(16,9,4,0.94);
    border: 1px solid #caa84e;
    color: #ffd9a0;
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    padding: 7px 13px;
  }
  #nbNudge span::after { content: " ↓"; }

  /* ── страница блокнота: линованная бумага, пружина, машинопись ──────────── */
  .nb-page {
    position: relative;
    width: min(92vw, 430px);
    max-height: min(82vh, 620px);
    display: flex; flex-direction: column;
    padding: 22px 20px 14px 54px;
    transform: rotate(-0.6deg);
    background:
      /* линии тетради (шаг = line-height записей) */
      repeating-linear-gradient(to bottom, transparent 0 21px, rgba(80,100,150,0.20) 21px 22px),
      /* красная вертикаль полей */
      linear-gradient(to right, transparent 44px, rgba(170,60,40,0.32) 44px, rgba(170,60,40,0.32) 45px, transparent 45px),
      /* бумага с возрастными пятнами */
      radial-gradient(130% 110% at 50% 0%, #ddd0ab 0%, #d3c49c 55%, #c0ae83 100%);
    box-shadow:
      0 24px 60px rgba(0,0,0,0.7),
      inset 0 0 70px rgba(110,85,40,0.28);
    color: #2e2412;
  }
  /* пробитые дырки пружины */
  .nb-page::before {
    content: ""; position: absolute; left: 16px; top: 10px; bottom: 10px;
    width: 14px;
    background-image: radial-gradient(circle at 7px 13px,
      rgba(14,8,3,0.9) 3.4px, rgba(60,42,20,0.7) 4px, transparent 5px);
    background-size: 14px 30px;
    background-repeat: repeat-y;
  }
  .nb-head {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #7e2018;
    border-bottom: 1px solid rgba(126,32,24,0.4);
    padding-bottom: 9px; margin-bottom: 13px;
  }
  #nbText {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    text-align: left;
    font-size: 11px; line-height: 22px;  /* строки ложатся на линовку */
    letter-spacing: 0.02em;
    color: #33281a;
    padding-right: 8px;
    scrollbar-color: rgba(110,80,40,0.5) transparent;
  }
  .nb-entry-head {
    color: #8a2a1c;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .nb-entry-head::before { content: "— "; opacity: 0.7; }
  .nb-stanza { margin-bottom: 22px; white-space: pre-wrap; opacity: 0; transform: translateY(3px); animation: nb-write .8s ease forwards; }
  .nb-stanza:last-child { margin-bottom: 4px; }
  .nb-empty { color: rgba(60,45,25,0.55); font-style: italic; }
  @keyframes nb-write { to { opacity: 1; transform: none; } }

  /* финальная запись — обведена красными чернилами от руки */
  .nb-final {
    color: #1e1812;
    padding: 10px 12px;
    border: 1.5px solid rgba(138,42,28,0.7);
    background: rgba(170,60,40,0.07);
    transform: rotate(-0.4deg);
    animation: nb-write .8s ease forwards;
  }
  #nbClose {
    align-self: flex-end;
    margin-top: 10px;
    background: none; border: none;
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #7e2018; cursor: pointer;
    border-bottom: 1px solid rgba(126,32,24,0.5);
    padding: 2px 2px 3px;
  }
  #nbClose:hover { color: #a83226; }

  /* ── мобайл: путь и подсказку прячем, рейки с приборами остаются ────────── */
  @media (pointer: coarse) {
    #title, #hint { display: none; }
    .frame {
      padding-top: calc(env(safe-area-inset-top, 0px) + 54px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 48px);
    }
  }

  /* ── оверлей (терминальная карточка) ───────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(4, 4, 9, 0.88);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s;
    padding: 28px;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .ov-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    gap: 15px;
    padding: 38px 40px;
    max-width: min(92vw, 460px);
    border: 1px solid var(--c-rule);
    background: rgba(6, 6, 12, 0.55);
  }
  .cn {
    position: absolute; font-size: 15px; line-height: 1;
    color: var(--c-accent-dim);
    text-shadow: 0 0 10px rgba(232,236,245,0.3);
    pointer-events: none;
  }
  .cn.tl { top: -8px; left: -7px; }
  .cn.tr { top: -8px; right: -7px; }
  .cn.bl { bottom: -8px; left: -7px; }
  .cn.br { bottom: -8px; right: -7px; }
  .ov-meta {
    color: var(--c-accent-dim);
    font-size: var(--t-xs); letter-spacing: var(--tk-mega);
    text-transform: uppercase;
  }
  .ov-card .t-display { text-align: center; }
  .ov-stats {
    font-size: var(--t-xs); letter-spacing: var(--tk-wide);
    text-transform: uppercase; color: var(--c-accent);
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .ov-poem {
    color: var(--c-value);
    font-size: clamp(10px, 1.3vh, 12px);
    line-height: 1.8em; letter-spacing: 0.04em;
    max-height: 44vh; overflow-y: auto;
    text-align: center; max-width: 38em;
    white-space: pre-wrap;
    padding: 6px 10px;
    border-top: 1px solid var(--c-rule);
    border-bottom: 1px solid var(--c-rule);
  }
  .ov-back {
    margin-top: 2px;
    text-decoration: none; color: var(--c-muted);
    font-size: var(--t-xs); letter-spacing: var(--tk-wide); text-transform: uppercase;
    transition: color 0.2s;
  }
  .ov-back:hover { color: var(--c-accent); }
</style>
</head>
<body>
<div class="frame">
  <section id="stage">
    <canvas id="c"></canvas>
    <div id="caseNo">досье № 1</div>
    <button id="hintBtn" title="подсказка — показать предмет">?</button>
    <div id="riddle"></div>
  </section>

  <button id="notebookBtn" type="button" title="открыть блокнот">
    <span class="nbb-l">блокнот</span>
    <span class="nbb-r" id="nbCount">пусто</span>
  </button>
  <div id="nbNudge"><span>новая запись — открой блокнот</span></div>
</div>

<!-- ── приборная панель: безель + рейки с приборами ─────────────────────── -->
<div class="os-bezel"><i>┌</i><i>┐</i><i>└</i><i>┘</i></div>
<header class="os-rail top">
  <div id="title" class="t-path">vol4:<span class="dim">//</span>нэнси-дрю</div>
  <div class="os-cells">
    <div class="t-stat">
      <div class="t-label">улика</div>
      <div class="t-value" id="riddle-num">1 / 6</div>
    </div>
    <div class="t-stat end">
      <div class="t-label">найдено</div>
      <div class="t-value accent" id="found-count">0 / 6</div>
    </div>
  </div>
  <a id="back" href="/">← карта</a>
</header>
<div class="os-rail bot">
  <div id="hint" class="t-hint arrow">найди предмет улики · «?» — подсказка</div>
</div>

<div id="winOverlay" class="overlay">
  <div class="ov-card">
    <span class="cn tl">┌</span><span class="cn tr">┐</span>
    <span class="cn bl">└</span><span class="cn br">┘</span>
    <div class="ov-meta">дело закрыто</div>
    <div class="t-display" style="color: var(--c-accent);">все смерти найдены</div>
    <div class="ov-stats" id="winStats"></div>
    <div class="ov-poem" id="winPoem"></div>
    <a class="t-btn" href="/" style="text-decoration:none">← на карту</a>
  </div>
</div>

<div id="nbOverlay" class="overlay">
  <div class="nb-page">
    <div class="nb-head">дело № 415 — блокнот детектива</div>
    <div id="nbText"></div>
    <button id="nbClose" type="button">закрыть страницу</button>
  </div>
</div>

<div class="scanlines"></div>

<!-- CRT-кинескоп: страница включается из чёрного (логика в shared/os.js) -->
<div id="crtFx" class="boot"><div class="crt-top"></div><div class="crt-bot"></div><div class="crt-line"></div></div>
<style>
  /* закрытое состояние до загрузки os.css — без вспышки контента */
  #crtFx { position: fixed; inset: 0; z-index: 999; pointer-events: none; }
  #crtFx .crt-top, #crtFx .crt-bot { position: absolute; left: 0; right: 0; height: 50.5%; background: #000; }
  #crtFx .crt-top { top: 0; transform-origin: 50% 0; }
  #crtFx .crt-bot { bottom: 0; transform-origin: 50% 100%; }
  #crtFx .crt-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; background: #e8ecf5; opacity: 0; }
</style>
<script type="module" src="/src/games/nancy-drew/main.js"></script>
</body>
</html>
